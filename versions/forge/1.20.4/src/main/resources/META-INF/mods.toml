modLoader = "javafml"
loaderVersion = "[48,)"
license = "MIT"
issueTrackerURL = "https://github.com/Shamanalle/chat-items/issues"

[[mods]]
modId = "chatitems"
version = "${version}"
displayName = "Chat Items"
displayURL = "https://github.com/Shamanalle/chat-items"
logoFile = "assets/chatitems/icon.png"
authors = "Shamanalle"
displayTest = "IGNORE_ALL_VERSION"
description = '''
Type [item], [inv] or [ender] in chat to show items with tooltips and read-only inventory snapshots. Server-side, vanilla clients welcome.

Пишите [item], [inv] или [ender] в чате, чтобы показать предмет с тултипом и снимок инвентаря или эндер-сундука только для чтения. Работает на сервере, ванильным клиентам мод не нужен.
'''

[[dependencies.chatitems]]
modId = "forge"
mandatory = true
versionRange = "[48,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.chatitems]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.2,1.20.5)"
ordering = "NONE"
side = "BOTH"
