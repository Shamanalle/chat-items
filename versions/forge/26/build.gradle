plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.2'
    id 'java'
}

// Forge, Minecraft 26.1 - 26.3 (see gradle/forge-band.gradle)
ext.forgeTarget = 'mc26.x'
ext.forgeVersion = 'forge26_version'
ext.forgeShared = ['shared/forge-bus7', 'shared/mc-26', 'shared/mc-1.21.11-up', 'shared/mc-all']
apply from: "${rootDir}/gradle/forge-band.gradle"
