modLoader = "javafml"
loaderVersion = "[51,)"
license = "MIT"
issueTrackerURL = "https://github.com/Shamanalle/chat-items/issues"

[[mods]]
modId = "chatitems"
version = "${version}"
displayName = "Chat Items"
displayURL = "https://github.com/Shamanalle/chat-items"
logoFile = "assets/chatitems/icon.png"
authors = "Kasper"
description = '''
Type [item], [inv] or [ender] in chat to show items with tooltips and read-only inventory snapshots. Server-side, vanilla clients welcome.
'''
displayTest = "IGNORE_SERVER_VERSION"

[[dependencies.chatitems]]
modId = "forge"
mandatory = true
versionRange = "[51,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.chatitems]]
modId = "minecraft"
mandatory = true
versionRange = "[1.21,1.21.5)"
ordering = "NONE"
side = "BOTH"
