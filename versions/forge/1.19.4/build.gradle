plugins {
    id 'net.neoforged.moddev.legacyforge' version '2.0.147'
    id 'java'
}

evaluationDependsOn(':common')

version = "${project.mod_version}+mc1.19.4"

base {
    archivesName = "chat-items-forge"
}

repositories {
    mavenCentral()
}

legacyForge {
    version = project.findProperty("loaderOverride.${project.name}") ?: project.forge1194_version
}

apply from: "${rootDir}/gradle/shared-sources.gradle"
useShared(['shared/forge-bus6', 'shared/mc-1.19', 'shared/mc-1.20.1', 'shared/mc-all'])

dependencies {
    implementation project(':common')
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

jar {
    from project(':common').sourceSets.main.output
}
