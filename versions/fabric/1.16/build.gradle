plugins {
    id 'fabric-loom' version '1.18.2'
    id 'java'
}

// Fabric / Quilt, Minecraft 1.16.4 - 1.16.5 (see gradle/fabric-band.gradle)
ext.fabricTarget = 'mc1.16.5'
ext.fabricKey = 'mc116'
ext.fabricJava = 8
ext.fabricMinecraft = '>=1.16.4 <1.17'
ext.fabricRemap = true
ext.fabricShared = ['shared/fabric-1.16-1.18', 'shared/mc-1.16', 'shared/mc-1.17', 'shared/mc-1.20.1', 'shared/mc-all']
apply from: "${rootDir}/gradle/fabric-band.gradle"
