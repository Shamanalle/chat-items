plugins {
    id 'fabric-loom' version '1.18.2'
    id 'java'
}

// Fabric / Quilt, Minecraft 1.21 - 1.21.4 (see gradle/fabric-band.gradle)
ext.fabricTarget = 'mc1.21-1.21.4'
ext.fabricKey = 'mc121'
ext.fabricJava = 21
ext.fabricMinecraft = '>=1.21 <1.21.5'
ext.fabricRemap = true
ext.fabricShared = ['shared/fabric', 'shared/mc-1.20.5-1.21.4', 'shared/mc-all']
apply from: "${rootDir}/gradle/fabric-band.gradle"
