plugins {
    id 'fabric-loom' version '1.18.2'
    id 'java'
}

// Fabric / Quilt, Minecraft 1.20 - 1.20.2 (see gradle/fabric-band.gradle)
ext.fabricTarget = 'mc1.20-1.20.2'
ext.fabricKey = 'mc120'
ext.fabricJava = 17
ext.fabricMinecraft = '>=1.20 <1.20.3'
ext.fabricRemap = true
ext.fabricShared = ['shared/fabric-1.19-1.20.4', 'shared/mc-1.20-1.20.4', 'shared/mc-1.20.1', 'shared/mc-all']
apply from: "${rootDir}/gradle/fabric-band.gradle"
