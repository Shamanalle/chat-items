# Gradle
org.gradle.jvmargs=-Xmx3G
# JDK 17 for the Java 8 build of the common code (gradle/jabel.gradle), found on the runner or downloaded
org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64
# Set up only the modules a task needs: the loader plugins prepare Minecraft for each module while
# configuring, so ':common:test' or one module's build would otherwise wait for all of them
org.gradle.configureondemand=true
# ForgeGradle 7 (the forge-1.20.6 ... forge-26 modules), as in Forge's own example project
net.minecraftforge.gradle.merge-source-sets=true

# Mod
mod_version=1.1.0
maven_group=com.kasper.chatitems

# Shared dependencies
slf4j_version=2.0.16

# Bukkit / Spigot / Paper / Purpur / Folia plugin (server side only, Java 8 bytecode + Folia Java 17 sourceSet)
bukkit_api_version=1.16.5-R0.1-SNAPSHOT
bukkit_modern_api_version=1.20.1-R0.1-SNAPSHOT

# --- Fabric / Quilt -------------------------------------------------------------------------------
