// A Fabric / Quilt build for one band of Minecraft versions (fabric-1.16, fabric-1.21.11, fabric-26, ...).
// Its jar is an input of the universal Fabric jar (see the root build.gradle), not a release file itself.
//
// The module applies Loom (fabric-loom, or net.fabricmc.fabric-loom for the unobfuscated 26.x) and sets,
// before applying this file:
//   fabricTarget     the file's version range, "mc1.21.5-1.21.10"
//   fabricKey        the gradle.properties prefix of its versions ("mc1215": mc1215_minecraft, ...)
//   fabricJava       8, 16, 17, 21 or 25
//   fabricShared     the shared folders it compiles, in order of precedence
//   fabricMinecraft  the Minecraft range for fabric.mod.json, ">=1.21.5 <1.21.11"
//   fabricRemap      true for obfuscated Minecraft (official names in the sources, intermediary in the jar)

def bandJava = fabricJava as int
def commonProject = bandJava < 17 ? ':common-j8' : ':common'
evaluationDependsOn(commonProject)

version = "${project.mod_version}+${fabricTarget}"

base {
    archivesName = "chat-items-fabric"
}

repositories {
    mavenCentral()
}

apply from: "${rootDir}/gradle/shared-sources.gradle"
useShared(fabricShared)

def mc = project.property("${fabricKey}_minecraft")
def loader = project.property("${fabricKey}_fabric_loader")
def api = project.property("${fabricKey}_fabric_api")

dependencies {
    implementation project(commonProject)
    minecraft "com.mojang:minecraft:${mc}"
    if (fabricRemap) {
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${loader}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${api}"
    } else {
        implementation "net.fabricmc:fabric-loader:${loader}"
        implementation "net.fabricmc.fabric-api:fabric-api:${api}"
    }
}

if (bandJava == 8) {
    apply from: "${rootDir}/gradle/jabel.gradle"
} else {
    tasks.withType(JavaCompile).configureEach {
        options.release = bandJava
        options.encoding = 'UTF-8'
    }

    java {
        sourceCompatibility = JavaVersion.toVersion(bandJava)
        targetCompatibility = JavaVersion.toVersion(bandJava)
    }
}

processResources {
    def props = [version: project.version, minecraft: fabricMinecraft, java: bandJava as String, fabricloader: loader]
    inputs.properties props
    filesMatching("fabric.mod.json") {
        expand props
    }
}

jar {
    from project(commonProject).sourceSets.main.output
}

if (fabricRemap) {
    remapJar {
        archiveClassifier = ''
    }
}

// The classpath the shipped jar runs with (intermediary names for 1.16.5 - 1.21.11, official names for 26.x).
// The compatibility check (.github/workflows/compat.yml) compares the jar against this list for each Minecraft release.
tasks.register('writeCompileClasspath') {
    def out = layout.buildDirectory.file('compile-classpath.txt')
    outputs.file out
    outputs.upToDateWhen { false }
    doLast {
        def files
        if (fabricRemap) {
            def loom = project.extensions.getByName('loom')
            def namespaces = loom.class.classLoader.loadClass('net.fabricmc.loom.api.mappings.layered.MappingsNamespace')
            def minecraft = loom.getMinecraftJars(namespaces.valueOf('INTERMEDIARY'))
            files = minecraft*.toFile() + configurations.minecraftLibraries.files + configurations.modCompileClasspath.files
        } else {
            files = sourceSets.main.compileClasspath.files
        }
        out.get().asFile.text = files.join('\n') + '\n'
    }
}

if (project.hasProperty('fabricGametest') && fabricGametest) {
    fabricApi {
        configureTests {
            createSourceSet = true
            modId = 'chatitems-gametest'
            enableGameTests = false
            enableClientGameTests = true
            eula = true
        }
    }

    sourceSets {
        gametest {
            java {
                srcDir "${rootDir}/shared/gametest/src/main/java"
            }
            resources {
                srcDir "${rootDir}/shared/gametest/src/main/resources"
                srcDir "${rootDir}/common/src/main/resources"
                include "assets/**", "fabric.mod.json", "*.mixins.json"
            }
        }
    }

    tasks.matching { it.name == 'runClientGameTest' }.configureEach {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(bandJava)
        }
        jvmArgs '-Dfabric.client.gametest.disableNetworkSynchronizer=true'
    }
}
