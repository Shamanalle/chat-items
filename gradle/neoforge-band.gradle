// A NeoForge build for one band of Minecraft versions (neoforge-1.20.6, neoforge-1.21, neoforge-26, ...).
// NeoForge runs with Minecraft's own names, so the shared code is compiled here against the band's Minecraft as it is.
// Its jar is an input of the universal Forge / NeoForge jar (see the root build.gradle).
//
// The module applies net.neoforged.moddev and sets, before applying this file:
//   nfTarget    the file's version range, "mc1.21-1.21.4"
//   nfVersion   the gradle.properties key of the NeoForge version it compiles against
//   nfShared    the shared folders it compiles, in order of precedence
// Every band is Java 21 bytecode: the universal jar holds nothing newer, since the oldest Forge and
// NeoForge it supports read every class in it with an ASM that stops at Java 21.

evaluationDependsOn(':common')

version = "${project.mod_version}+${nfTarget}"

base {
    archivesName = "chat-items-neoforge"
}

repositories {
    mavenCentral()
}

neoForge {
    version = project.findProperty("loaderOverride.${project.name}") ?: project.property(nfVersion)
}

apply from: "${rootDir}/gradle/shared-sources.gradle"
useShared(nfShared)

dependencies {
    implementation project(':common')
}

def bandJava = (project.findProperty('nfJava') ?: 21) as int

tasks.withType(JavaCompile).configureEach {
    options.release = bandJava
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.toVersion(bandJava)
    targetCompatibility = JavaVersion.toVersion(bandJava)
    disableAutoTargetJvm()
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/*.toml") {
        expand "version": project.version
    }
}

jar {
    from project(':common').sourceSets.main.output
}

// The classpath with Minecraft's own names, the ones the released jar runs with: Minecraft and NeoForge as one jar,
// their libraries. The compatibility check (.github/workflows/compat-neoforge.yml) compares the jar against it for each
// NeoForge version of the band.
tasks.register('writeCompileClasspath') {
    dependsOn "createMinecraftArtifacts"
    def out = layout.buildDirectory.file('compile-classpath.txt')
    outputs.file out
    outputs.upToDateWhen { false }
    doLast {
        out.get().asFile.text = configurations.compileClasspath.files.join('\n') + '\n'
    }
}
