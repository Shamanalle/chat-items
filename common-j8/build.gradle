plugins {
    id 'java-library'
}

// The sources of ':common' compiled to Java 8 bytecode (see gradle/jabel.gradle), for the Bukkit plugin
// and the universal jars, whose shared classes run on every Minecraft version
base {
    archivesName = "chat-items-common-j8"
}

repositories {
    mavenCentral()
}

apply from: "${rootDir}/gradle/jabel.gradle"

sourceSets {
    main {
        java.srcDir "${rootDir}/common/src/main/java"
        resources.srcDir "${rootDir}/common/src/main/resources"
    }
}

processResources {
    inputs.property "version", project.mod_version
    filesMatching("chatitems-build.properties") {
        expand "version": project.mod_version
    }
}
