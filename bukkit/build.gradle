plugins {
    id 'java'
}

// This build script reads common's source set, and ':bukkit' is configured before ':common-j8'
evaluationDependsOn(':common-j8')

// Bukkit, Spigot, Paper, Purpur and Folia 1.16.5+: the server side only.
// Compiled against the 1.16.5 API (Java 8 bytecode, see gradle/jabel.gradle) and uses only API that later
// versions still have; Folia's schedulers (1.20+) live in the "folia" source set.
version = project.mod_version

base {
    archivesName = "chat-items-bukkit"
}

repositories {
    mavenCentral()
    maven {
        name = "papermc"
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    implementation project(':common-j8')
    compileOnly "com.destroystokyo.paper:paper-api:${project.bukkit_api_version}"
}

apply from: "${rootDir}/gradle/jabel.gradle"

sourceSets {
    folia {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
    }
}
configurations.foliaCompileClasspath {
    attributes.attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 17)
}
dependencies {
    foliaCompileOnly "io.papermc.paper:paper-api:${project.bukkit_modern_api_version}"
}
tasks.named('compileFoliaJava') { dependsOn 'compileJava' }

processResources {
    inputs.property "version", project.version
    filesMatching("plugin.yml") {
        expand "version": project.version
    }
}

tasks.named('jar') {
    from(sourceSets.folia.output)
    from(project(':common-j8').sourceSets.main.output) {
        exclude 'assets/chatitems/icon.png'
    }
}

tasks.register('checkPluginJar') {
    def jarFile = tasks.named('jar').flatMap { it.archiveFile }
    inputs.file jarFile
    dependsOn 'jar'
    doLast {
        def names = new java.util.zip.ZipFile(jarFile.get().asFile).withCloseable { zip -> zip.entries().collect { it.name } }
        for (String required : ['plugin.yml', 'assets/chatitems/lang/en_us.json', 'assets/chatitems/lang/ru_ru.json',
                                'com/kasper/chatitems/ServerText.class', 'com/kasper/chatitems/bukkit/FoliaScheduling.class']) {
            if (!names.contains(required)) {
                throw new GradleException("The plugin jar lacks " + required)
            }
        }
    }
}
tasks.named('build') { dependsOn 'checkPluginJar' }
