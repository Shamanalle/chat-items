name: ChatItems
version: '${version}'
main: com.kasper.chatitems.bukkit.ChatItemsBukkit
api-version: '1.16'
folia-supported: true
author: Shamanalle
website: https://github.com/Shamanalle/chat-items
description: Type [item], [armor], [offhand], [slot1-9], [inv] or [ender] in chat to share items, tooltips, shulker boxes, bundles, and read-only inventory snapshots.
commands:
  chatitems:
    description: Chat Items settings and read-only snapshot viewer
    usage: /chatitems [status|enabled|item|inv|ender|max_tokens|cooldown|ttl|reload|help|view <id>]
permissions:
  chatitems.admin:
    description: Configure Chat Items via /chatitems
    default: op
  chatitems.item:
    description: Use [item], [offhand], [armor], and [slot1]-[slot9] in chat
    default: true
  chatitems.inv:
    description: Use [inv] in chat to share inventory snapshots
    default: true
  chatitems.ender:
    description: Use [ender] in chat to share ender chest snapshots
    default: true
  chatitems.bypass.cooldown:
    description: Bypass the per-player chat token cooldown
    default: op
