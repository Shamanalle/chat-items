name: Build & Verify

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test & build all targets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Java 25 runs the main build; Java 21 runs the Gradle 8 legacy sub-builds; Java 17 runs Jabel
      - name: Set up JDK 17, 21 and 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            17
            21
            25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew versions/forge/1.16.5/gradlew versions/forge/1.20.4/gradlew versions/neoforge/1.20.4/gradlew

      - name: Unit tests (shared logic, translations, jar merging)
        run: bash .github/scripts/net-retry.sh -- ./gradlew :common:test :packaging:test --no-daemon

      - name: Build every Minecraft target
        run: bash .github/scripts/net-retry.sh -- ./gradlew build -x test --no-daemon

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: chat-items
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            common/build/reports/tests/
            packaging/build/reports/tests/

  # Each Forge / NeoForge jar serves a band of Minecraft versions: it is built against the newest loader
  # of the band, and here also compiled against the oldest, so a call missing there fails the build
  oldest:
    name: Oldest loader of ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { module: forge-1.16.5, key: forge1165_version_oldest, own: true }
          - { module: forge-1.17, key: forge117_version_oldest }
          - { module: forge-1.18, key: forge118_version_oldest }
          - { module: forge-1.19, key: forge119_version_oldest }
          - { module: forge-1.19.4, key: forge1194_version_oldest }
          - { module: forge-1.20.1, key: forge120_version_oldest }
          - { module: forge-1.20.4, key: forge1204_version_oldest, own: true }
          - { module: forge-1.20.6, key: forge1206_version_oldest }
          - { module: forge-1.21, key: forge121_version_oldest }
          - { module: forge-1.21.5, key: forge1215_version_oldest }
          - { module: forge-1.21.10, key: forge12110_version_oldest }
          - { module: forge-1.21.11, key: forge12111_version_oldest }
          - { module: forge-26, key: forge26_version_oldest }
          - { module: neoforge-1.20.2, key: nf1202_neoforge_oldest, own: true }
          - { module: neoforge-1.20.4, key: nf1204_neoforge_oldest, own: true }
          - { module: neoforge-1.21.1, key: nf121_neoforge_oldest }
          - { module: neoforge-1.21.10, key: nf12110_neoforge_oldest }
          - { module: neoforge-1.21.11, key: nf12111_neoforge_oldest }
          - { module: neoforge-26, key: nf26_neoforge_oldest }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17, 21 and 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            17
            21
            25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile against the oldest loader
        run: |
          chmod +x gradlew versions/forge/1.16.5/gradlew versions/forge/1.20.4/gradlew versions/neoforge/1.20.4/gradlew
          oldest=$(grep "^${{ matrix.key }}=" gradle.properties | cut -d= -f2)
          echo "${{ matrix.module }} against ${oldest}"
          module="${{ matrix.module }}"
          if [ "${{ matrix.own }}" = "true" ]; then
            cd "versions/${module%%-*}/${module#*-}"
            wrapper=gradlew; [ -f gradlew ] || wrapper=../1.20.4/gradlew
            home="${JAVA_HOME_21_X64}"; case "${module}" in *1.16.5) home="${JAVA_HOME_17_X64}";; esac
            JAVA_HOME="${home}" sh "${wrapper}" compileJava -PloaderOverride=${oldest} --no-daemon
          else
            bash .github/scripts/net-retry.sh -- ./gradlew :${module}:compileJava \
              -PloaderOverride.${module}=${oldest} --configure-on-demand --no-daemon
          fi
