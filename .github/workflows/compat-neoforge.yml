name: NeoForge compatibility

# Checks each NeoForge band jar against both its newest and oldest NeoForge releases using LinkCheck.java.

on:
  push:
    branches: [ "main" ]
    paths:
      - 'versions/neoforge/**'
      - 'shared/neoforge/**'
      - 'shared/mc-**'
      - 'common/src/main/**'
      - 'gradle/neoforge-band.gradle'
      - 'gradle.properties'
      - '.github/scripts/LinkCheck.java'
      - '.github/scripts/linkcheck-selftest.sh'
      - '.github/workflows/compat-neoforge.yml'
  pull_request:
    paths:
      - 'versions/neoforge/**'
      - 'shared/neoforge/**'
      - 'shared/mc-**'
      - 'common/src/main/**'
      - 'gradle/neoforge-band.gradle'
      - 'gradle.properties'
      - '.github/scripts/LinkCheck.java'
      - '.github/scripts/linkcheck-selftest.sh'
      - '.github/workflows/compat-neoforge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.module }} (${{ matrix.key }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { module: neoforge-1.21.1, dir: versions/neoforge/1.21.1, target: mc1.21-1.21.1, key: nf121_neoforge_oldest }
          - { module: neoforge-1.21.10, dir: versions/neoforge/1.21.10, target: mc1.21.9-1.21.10, key: nf12110_neoforge_oldest }
          - { module: neoforge-26, dir: versions/neoforge/26, target: mc26.x, key: nf26_neoforge_oldest }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: LinkCheck self-test
        run: bash .github/scripts/linkcheck-selftest.sh

      - name: Build the jar for the reference NeoForge version
        run: |
          bash .github/scripts/net-retry.sh -- ./gradlew :${{ matrix.module }}:assemble :${{ matrix.module }}:writeCompileClasspath --no-daemon
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          cp "${{ matrix.dir }}/build/libs/chat-items-neoforge-${version}+${{ matrix.target }}.jar" "${RUNNER_TEMP}/mod.jar"
          cp "${{ matrix.dir }}/build/compile-classpath.txt" "${RUNNER_TEMP}/reference-classpath.txt"

      - name: Classpath of the oldest NeoForge in the band
        run: |
          oldest=$(grep "^${{ matrix.key }}=" gradle.properties | cut -d= -f2)
          bash .github/scripts/net-retry.sh -- ./gradlew :${{ matrix.module }}:writeCompileClasspath \
            -PloaderOverride.${{ matrix.module }}=${oldest} --no-daemon
          cp "${{ matrix.dir }}/build/compile-classpath.txt" "${RUNNER_TEMP}/target-classpath.txt"

      - name: Check the reference jar links against the oldest NeoForge
        run: |
          java .github/scripts/LinkCheck.java "${RUNNER_TEMP}/mod.jar" \
            "${RUNNER_TEMP}/reference-classpath.txt" "${RUNNER_TEMP}/target-classpath.txt"
